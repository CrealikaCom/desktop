# Builds the launcher for Windows, Linux and macOS. Pushes and pull requests run the tests; the
# builds run when started by hand (Run workflow) and for a tag v<version> (the version in
# package.json), which also publishes a release that installed launchers pick up as an update.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # For a tag: a draft release that the builds upload into, published once all of them succeed.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check the tag against package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Crealika Desktop ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    needs: [test, draft]
    if: ${{ !failure() && !cancelled() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the Linux builds working on distributions with glibc 2.35 and newer.
          - os: ubuntu-22.04
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No signing certificates yet; macOS builds get an ad-hoc signature.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          publish=never
          case "$GITHUB_REF" in refs/tags/v*) publish=always ;; esac
          npx electron-builder ${{ matrix.target }} --publish "$publish"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.yml
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
