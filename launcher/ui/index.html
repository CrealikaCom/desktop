<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Crealika Desktop</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Crealika Desktop</h1>
    <div id="account" class="account"></div>
  </header>
  <main>
    <p id="error" class="error" hidden></p>
    <div id="notice" class="notice" hidden></div>
    <ul id="services" class="services"></ul>
  </main>
  <footer>
    <span>Home: <code id="home"></code></span>
    <nav>
      <button data-folder="home">Open</button>
      <button data-folder="models">models</button>
      <button data-folder="output">output</button>
      <button data-folder="logs">logs</button>
      <button data-folder="config">config</button>
    </nav>
  </footer>
</body>
</html>
