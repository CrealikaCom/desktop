<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Crealika Desktop</title>
  <link rel="stylesheet" href="/crealika-ui-core/themes/index.css">
  <link rel="stylesheet" href="/crealika-ui-core/crealika-ui.css">
  <link rel="stylesheet" href="/style.css">
  <!--preferences-->
  <script src="/crealika-ui-core/crealika-prefs.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="cr-page launcher">
    <div class="launcher-head">
      <h1>Services</h1>
      <p class="launcher-lead">Install a Crealika service and open it. Services keep running when you close the launcher.</p>
    </div>
    <p id="error" class="launcher-error" role="alert" hidden></p>
    <div id="notice" class="launcher-notice" hidden></div>
    <ul id="services" class="launcher-services"></ul>
  </main>
  <footer class="cr-page launcher-footer">
    <span>Home: <code id="home"></code></span>
    <nav class="launcher-folders" aria-label="Folders">
      <button class="cr-button" data-folder="home">Open</button>
      <button class="cr-button" data-folder="models">models</button>
      <button class="cr-button" data-folder="output">output</button>
      <button class="cr-button" data-folder="logs">logs</button>
      <button class="cr-button" data-folder="config">config</button>
    </nav>
  </footer>
</body>
</html>
